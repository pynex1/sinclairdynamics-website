  <div class="consent-banner" id="consent-banner" role="region" aria-label="Cookie and analytics consent"

    <div class="consent-inner">
      <p class="consent-text">This site uses Google Analytics to understand how it's used. It only runs if you agree

      <div class="consent-actions">
        <button type="button" class="consent-btn" id="consent-decline">Decline</button>
        <button type="button" class="consent-btn" id="consent-accept">Accept</button>
      </div>
    </div>
  </div>
  <script>
    // Consent banner. Self-contained, warns to console rather than failing
    // silently, and does nothing at all if its own markup is missing.
    //
    // Two keys in localStorage, matching the site's existing sinclair_chat_*
    // convention rather than a JSON blob: sinclair_analytics_consent holds
    // "accepted" or "declined", sinclair_analytics_consent_at holds when.
    // Persists indefinitely. There is no re-ask timer: nothing on this site
    // currently expires anything on a schedule, and building one for this
    // control alone would be scope the retention item next to it hasn't
    // earned either. See the working document if that changes.
    (function () {
      var KEY = 'sinclair_analytics_consent';
      var KEY_AT = 'sinclair_analytics_consent_at';
      var GA_ID = 'G-W94Z1196CH';

      var banner = document.getElementById('consent-banner');
      if (!banner) {
        console.warn('[consent] banner markup not found, nothing to wire up');
        return;
      }

      function loadAnalytics() {
        if (window.__sinclairAnalyticsLoaded) return;
        window.__sinclairAnalyticsLoaded = true;
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(tag);
      }

      function recordChoice(choice) {
        try {
          localStorage.setItem(KEY, choice);
          localStorage.setItem(KEY_AT, new Date().toISOString());
        } catch (e) {
          console.warn('[consent] could not write the choice to localStorage', e);
        }
      }

      var stored = null;
      try {
        stored = localStorage.getItem(KEY);
      } catch (e) {
        console.warn('[consent] could not read localStorage, treating as unanswered', e);
      }

      if (stored === 'accepted') {
        loadAnalytics();
      } else if (stored !== 'declined') {
        // Unanswered. Neither key is trusted on its own: only an explicit
        // "declined" suppresses the banner without also loading the tag.
        banner.setAttribute('data-state', 'visible');
      }

      var acceptBtn = document.getElementById('consent-accept');
      var declineBtn = document.getElementById('consent-decline');

      if (acceptBtn) {
        acceptBtn.addEventListener('click', function () {
          recordChoice('accepted');
          banner.setAttribute('data-state', 'hidden');
          loadAnalytics();
        });
      }
      if (declineBtn) {
        declineBtn.addEventListener('click', function () {
          recordChoice('declined');
          banner.setAttribute('data-state', 'hidden');
        });
      }
    })();
